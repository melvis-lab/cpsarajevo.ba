<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Collection Premium Sarajevo</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* Admin: light, neutral, system font */
  :root { --bg:#ffffff; --panel:#ffffff; --soft:#f6f7f9; --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#9a7432; --accent-soft:#f6efe2; --ok:#1a7f37; --warn:#b26a00; --bad:#c62828; color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--soft); color:var(--ink); font:14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:14px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:17px; font-weight:600; margin:0; }
  header small { color:var(--muted); }
  nav { display:flex; gap:4px; overflow-x:auto; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); border-bottom:1px solid var(--line); background:var(--bg); }
  nav button { background:none; border:1px solid transparent; color:var(--muted); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; font:inherit; font-weight:500; }
  nav button:hover { background:var(--soft); color:var(--ink); }
  nav button[aria-selected="true"] { background:var(--accent-soft); color:var(--accent); border-color:#ead9b8; }
  main { padding-block:20px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); max-width:1232px; margin:0 auto; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:20px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .tile .n { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tile .l { color:var(--muted); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow-x:auto; margin-bottom:20px; }
  .card h2 { font-size:13px; font-weight:600; color:var(--ink); margin:14px 16px 10px; }
  table { width:100%; border-collapse:collapse; min-width:560px; }
  th, td { text-align:left; padding:9px 16px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; background:#fafbfc; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:6px; background:var(--accent); border-radius:3px; opacity:.7; }
  select, input, button.act { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  button.act { cursor:pointer; } button.act:hover { background:var(--soft); }
  button.primary { background:var(--ink); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .muted { color:var(--muted); }
  .center { max-width:400px; margin:12vh auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .center h1 { font-size:22px; font-weight:600; margin:0 0 6px; }
  .center form { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .center input { width:100%; padding:10px 12px; margin:0 0 12px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
  [hidden] { display:none !important; }
  .st-nova { color:var(--warn); } .st-potvrdjena, .st-isporucena { color:var(--ok); } .st-otkazana { color:var(--bad); }
</style>
</head>
<body>

<section id="gate" class="center">
  <h1>Collection Premium · Admin</h1>
  <p class="muted" id="gateMsg">Prijavi se emailom koji ima admin pristup.</p>
  <form id="loginForm"><input id="email" type="email" required placeholder="email" autocomplete="email"><button class="primary">Pošalji link</button></form>
</section>

<div id="app" hidden>
  <header><div><h1>Collection Premium · Admin</h1><small id="me"></small></div><button class="act" id="logout">Odjava</button></header>
  <nav role="tablist">
    <button role="tab" data-tab="pregled" aria-selected="true">Pregled</button>
    <button role="tab" data-tab="rezervacije">Rezervacije</button>
    <button role="tab" data-tab="klikovi">Klikovi</button>
    <button role="tab" data-tab="izvori">Izvori</button>
    <button role="tab" data-tab="uzivo">Uživo</button>
  </nav>
  <main>
    <section data-panel="pregled">
      <div class="tiles" id="tiles"></div>
      <div class="card"><h2>Po danima (14 dana)</h2><table id="daily"></table></div>
      <div class="card"><h2>Rezervacije po mirisu</h2><table id="byProduct"></table></div>
      <div class="card"><h2>Referal kodovi</h2><table id="referrals"></table></div>
    </section>
    <section data-panel="rezervacije" hidden>
      <div class="toolbar">
        <select id="statusFilter"><option value="">Sve</option><option value="nova">Nove</option><option value="kontaktirana">Kontaktirane</option><option value="potvrdjena">Potvrđene</option><option value="isporucena">Isporučene</option><option value="otkazana">Otkazane</option></select>
        <input id="search" placeholder="Traži ime, telefon, email">
        <button class="act" id="csv">Izvezi CSV</button>
        <span class="muted" id="resCount"></span>
      </div>
      <div class="card"><table id="resTable"></table></div>
    </section>
    <section data-panel="klikovi" hidden><div class="card"><h2>Najviše klikova (30 dana)</h2><table id="clicks"></table></div></section>
    <section data-panel="izvori" hidden><div class="card"><h2>Odakle dolaze (30 dana)</h2><table id="sources"></table></div></section>
    <section data-panel="uzivo" hidden><div class="toolbar"><button class="act" id="refreshLive">Osvježi</button><span class="muted">Zadnjih 100 događaja</span></div><div class="card"><table id="live"></table></div></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/cp-backend.js"></script>
<script>
(async function () {
  const sb = CP.sb, $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (d) => new Date(d).toLocaleString('bs-BA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const STATUSES = [['nova', 'Nova'], ['kontaktirana', 'Kontaktirana'], ['potvrdjena', 'Potvrđena'], ['isporucena', 'Isporučena'], ['otkazana', 'Otkazana']];
  let reservations = [];

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await CP.auth.sendLink($('email').value, '/admin/');
    $('gateMsg').textContent = r.ok ? 'Link je poslan. Otvori ga na ovom uređaju.' : 'Greška: ' + r.error;
  });
  $('logout').addEventListener('click', async () => { await CP.auth.signOut(); location.reload(); });

  document.querySelectorAll('nav [data-tab]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('nav [data-tab]').forEach((x) => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== b.dataset.tab; });
    if (b.dataset.tab === 'uzivo') loadLive();
  }));

  function table(el, cols, rows, empty) {
    if (!rows || !rows.length) { el.innerHTML = '<tr><td class="muted">' + (empty || 'Još nema podataka.') + '</td></tr>'; return; }
    el.innerHTML = '<tr>' + cols.map((c) => '<th class="' + (c.num ? 'num' : '') + '">' + c.h + '</th>').join('') + '</tr>' +
      rows.map((r) => '<tr>' + cols.map((c) => '<td class="' + (c.num ? 'num' : '') + '">' + (c.html ? c.html(r) : esc(r[c.k])) + '</td>').join('') + '</tr>').join('');
  }
  const barCol = (k, max) => ({ h: '', html: (r) => '<div class="bar" style="width:' + Math.max(2, Math.round(100 * (r[k] || 0) / (max || 1))) + 'px"></div>' });

  async function loadOverview() {
    const [{ data: daily }, { data: prod }, { data: refs }] = await Promise.all([
      sb.from('admin_daily').select('*').limit(14),
      sb.from('admin_reservations_by_product').select('*'),
      sb.from('admin_referrals').select('*'),
    ]);
    const d = daily || [], week = d.slice(0, 7);
    const sum = (k) => week.reduce((a, r) => a + (r[k] || 0), 0);
    const resTotal = (prod || []).reduce((a, r) => a + r.reservations, 0);
    const bottles = (prod || []).reduce((a, r) => a + r.bottles, 0);
    $('tiles').innerHTML = [
      ['Posjetioci, 7 dana', sum('visitors')], ['Pregledi stranica, 7 dana', sum('page_views')],
      ['Završen kviz, 7 dana', sum('quiz_done')], ['Rezervacije, 7 dana', sum('reserved')],
      ['Rezervacije ukupno', resTotal], ['Bočica rezervisano', bottles],
    ].map(([l, n]) => '<div class="tile"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>').join('');
    const maxV = Math.max(1, ...d.map((r) => r.visitors));
    table($('daily'), [
      { h: 'Dan', k: 'day' }, { h: 'Posjetioci', k: 'visitors', num: 1 }, barCol('visitors', maxV),
      { h: 'Pregledi', k: 'page_views', num: 1 }, { h: 'Klikovi', k: 'clicks', num: 1 },
      { h: 'Kviz', k: 'quiz_done', num: 1 }, { h: 'Otvorili formu', k: 'reserve_opened', num: 1 }, { h: 'Rezervisali', k: 'reserved', num: 1 },
    ], d);
    const maxB = Math.max(1, ...(prod || []).map((r) => r.bottles));
    table($('byProduct'), [{ h: 'Miris', k: 'name' }, { h: 'Rezervacije', k: 'reservations', num: 1 }, { h: 'Bočice', k: 'bottles', num: 1 }, barCol('bottles', maxB), { h: 'Otvorene', k: 'open', num: 1 }], prod);
    table($('referrals'), [{ h: 'Kod', k: 'code' }, { h: 'Rezervacije', k: 'reservations', num: 1 }, { h: 'Bočice', k: 'bottles', num: 1 }, { h: 'Zadnja', html: (r) => fmt(r.last) }], refs, 'Niko još nije koristio referal kod.');
  }

  async function loadReservations() {
    const { data } = await sb.from('reservations').select('*, products(name)').order('created_at', { ascending: false }).limit(1000);
    reservations = data || [];
    renderReservations();
  }
  function renderReservations() {
    const f = $('statusFilter').value, q = $('search').value.trim().toLowerCase();
    const rows = reservations.filter((r) => (!f || r.status === f) &&
      (!q || [r.full_name, r.phone, r.email, r.city].join(' ').toLowerCase().includes(q)));
    $('resCount').textContent = rows.length + ' od ' + reservations.length;
    table($('resTable'), [
      { h: 'Kada', html: (r) => fmt(r.created_at) },
      { h: 'Kupac', html: (r) => '<b>' + esc(r.full_name) + '</b><div class="muted">' + esc(r.phone) + (r.email ? ' · ' + esc(r.email) : '') + '</div>' },
      { h: 'Miris', html: (r) => esc(r.products && r.products.name) + ' × ' + r.quantity },
      { h: 'Grad', k: 'city' },
      { h: 'Izvor', html: (r) => esc([r.utm_source, r.utm_campaign, r.referral_code && 'ref:' + r.referral_code].filter(Boolean).join(' · ')) },
      { h: 'Napomena', html: (r) => esc(r.note) },
      { h: 'Status', html: (r) => '<select data-id="' + r.id + '" class="st-' + r.status + '">' + STATUSES.map(([v, l]) => '<option value="' + v + '"' + (v === r.status ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' },
    ], rows, 'Još nema rezervacija.');
  }
  $('resTable').addEventListener('change', async (e) => {
    const s = e.target.closest('select[data-id]'); if (!s) return;
    const { error } = await sb.from('reservations').update({ status: s.value }).eq('id', s.dataset.id);
    if (error) { alert('Status nije promijenjen.'); return; }
    s.className = 'st-' + s.value;
    const r = reservations.find((x) => x.id === s.dataset.id); if (r) r.status = s.value;
  });
  $('statusFilter').addEventListener('change', renderReservations);
  $('search').addEventListener('input', renderReservations);
  $('csv').addEventListener('click', () => {
    const cols = ['created_at', 'full_name', 'phone', 'email', 'product_slug', 'quantity', 'city', 'address', 'status', 'utm_source', 'utm_campaign', 'referral_code', 'note'];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const csv = [cols.join(',')].concat(reservations.map((r) => cols.map((c) => q(r[c])).join(','))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'rezervacije-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
  });

  async function loadClicks() {
    const { data } = await sb.from('admin_top_clicks').select('*').limit(100);
    const max = Math.max(1, ...(data || []).map((r) => r.clicks));
    table($('clicks'), [{ h: 'Element', k: 'element' }, { h: 'Tekst / link', k: 'label' }, { h: 'Stranica', k: 'path' }, { h: 'Klikovi', k: 'clicks', num: 1 }, barCol('clicks', max), { h: 'Zadnji', html: (r) => fmt(r.last_click) }], data);
  }
  async function loadSources() {
    const { data } = await sb.from('admin_sources').select('*');
    const max = Math.max(1, ...(data || []).map((r) => r.visitors));
    table($('sources'), [{ h: 'Izvor', k: 'source' }, { h: 'Kampanja', k: 'campaign' }, { h: 'Posjetioci', k: 'visitors', num: 1 }, barCol('visitors', max), { h: 'Rezervisali', k: 'reserving_sessions', num: 1 }], data);
  }
  async function loadLive() {
    const { data } = await sb.from('events').select('created_at, type, element, label, path, device, utm_source, session_id').order('created_at', { ascending: false }).limit(100);
    table($('live'), [{ h: 'Vrijeme', html: (r) => fmt(r.created_at) }, { h: 'Događaj', k: 'type' }, { h: 'Element', k: 'element' }, { h: 'Tekst', k: 'label' }, { h: 'Stranica', k: 'path' }, { h: 'Uređaj', k: 'device' }, { h: 'Izvor', k: 'utm_source' }, { h: 'Posjeta', html: (r) => esc(r.session_id.slice(0, 6)) }], data);
  }
  $('refreshLive').addEventListener('click', loadLive);

  async function start() {
    const user = await CP.auth.user();
    if (!user) return;
    const { data: isAdmin } = await sb.rpc('is_admin');
    if (!isAdmin) { $('gateMsg').textContent = user.email + ' nema admin pristup.'; return; }
    $('gate').hidden = true; $('app').hidden = false; $('me').textContent = user.email;
    loadOverview(); loadReservations(); loadClicks(); loadSources();
  }
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN') start(); });
  start();
})();
</script>
</body>
</html>
